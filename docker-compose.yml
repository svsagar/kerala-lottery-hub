version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kerala_lottery_user
      POSTGRES_PASSWORD: kerala_lottery_password
      POSTGRES_DB: kerala_lottery
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kerala_lottery_user -d kerala_lottery"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: api-runtime
    environment:
      DATABASE_URL: postgresql://kerala_lottery_user:kerala_lottery_password@postgres:5432/kerala_lottery
      API_PORT: 3001
      API_HOST: 0.0.0.0
      NODE_ENV: development
      VITE_API_URL: http://localhost:3001/api/v1
      LOG_LEVEL: debug
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages:/app/packages
    command: npm -w apps/api run dev

  web:
    build:
      context: .
      target: web-runtime
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:3001/api/v1
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/index.html:/app/index.html
    command: npm -w apps/web run dev

volumes:
  postgres_data:

networks:
  default:
    name: kerala-lottery-network
